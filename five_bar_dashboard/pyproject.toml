[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "five-bar-dashboard"
version = "1.7.0"
description = "Native PySide6 dashboard for an ODrive-controlled five-bar parallel SCARA"
requires-python = ">=3.10,<3.12"
dependencies = [
  "odrive==0.5.4",
  "PySide6>=6.7",
  "pyqtgraph>=0.13",
  "numpy>=1.26",
  "scipy>=1.11",
]

[project.scripts]
five-bar-dashboard = "five_bar_dashboard.app:main"

[tool.setuptools]
packages = ["five_bar_dashboard", "five_bar_dashboard.widgets"]
